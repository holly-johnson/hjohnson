<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Holly Johnson · Product design, design systems and AI-assisted tooling</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The pair follows the browser chrome, not the site theme: someone can browse
         in dark chrome with the site in light mode. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg?v=4" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg?v=4" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg?v=4" />

    <!-- Primary meta -->
    <meta
      name="description"
      content="Product design and design systems: Theorem, Helios and NUcleus. Design tokens, component libraries and the AI tooling built alongside them."
    />
    <meta name="author" content="Holly Johnson" />
    <meta name="theme-color" content="#171513" />

    <!-- The home page's values, and the fallback for every other route. Angular
         replaces them on navigation and the Netlify edge function replaces them in
         the served HTML, so these are what a crawler sees only if both are skipped.
         Absolute URLs on purpose: relative ones are rejected by most card parsers. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Holly Johnson" />
    <meta property="og:title" content="Holly Johnson · Product design, design systems and AI-assisted tooling" />
    <meta
      property="og:description"
      content="Product design and design systems: Theorem, Helios and NUcleus. Design tokens, component libraries and the AI tooling built alongside them."
    />
    <meta property="og:url" content="https://hollyjohnson.design/" />
    <meta property="og:image" content="https://hollyjohnson.design/assets/social/home.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Holly Johnson · Product design, design systems and AI-assisted tooling" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Holly Johnson · Product design, design systems and AI-assisted tooling" />
    <meta
      name="twitter:description"
      content="Product design and design systems: Theorem, Helios and NUcleus. Design tokens, component libraries and the AI tooling built alongside them."
    />
    <meta name="twitter:image" content="https://hollyjohnson.design/assets/social/home.png?v=2" />

    <!-- Who this is, in the form search engines and AI assistants actually read.
         `sameAs` is the claim that this site and that LinkedIn profile are one
         person rather than two strangers with the same name.

         Deliberately the short version. The edge function replaces this with the
         full graph for whichever route was requested (see seo/structured-data.ts);
         this is only the floor, and index.html.spec.ts keeps it honest against
         seo/site-metadata.json. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://hollyjohnson.design/#person",
        "name": "Holly Johnson",
        "jobTitle": "Product Designer & Design Systems Lead",
        "url": "https://hollyjohnson.design/",
        "sameAs": ["https://www.linkedin.com/in/holly-johnson-design"]
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
