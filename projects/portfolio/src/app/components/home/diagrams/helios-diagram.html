<!--
  Helios homepage-card diagram — Design → Helios → Product.
  Helios IS the coded design system (not a step before code): the central,
  dominant anchor design flows into and products are built from. AI/MCP is a
  faint enabling mark on the first link. Ported from the concept preview;
  flagged for a later revision. Flex layout so it scales across card widths.
-->
<div class="w-full h-full relative overflow-hidden flex items-center justify-center px-4">
  <div class="flex items-center justify-center w-full max-w-[480px] gap-2 sm:gap-3">

    <!-- Design (Figma) -->
    <div class="relative flex items-center justify-center shrink-0">
      <div class="w-16 h-16 border border-border bg-background flex items-center justify-center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#D06A3D">
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
        </svg>
      </div>
      <div class="absolute top-full mt-2 font-mono text-[10px] tracking-[0.14em] uppercase text-[#5C5248] whitespace-nowrap">Design</div>
    </div>

    <!-- link 1: Design → Helios (carries the faint ai · mcp assist) -->
    <div class="relative flex items-center flex-1 min-w-[20px]">
      <div class="absolute -top-4 inset-x-0 text-center font-mono text-[8px] tracking-wide text-[#857C74] whitespace-nowrap">ai · mcp</div>
      <div class="h-px flex-1 bg-[#B04318]"></div>
      <svg width="8" height="8" viewBox="0 0 8 8" class="shrink-0 -ml-px">
        <path d="M1 1 L7 4 L1 7 Z" fill="#B04318" />
      </svg>
    </div>

    <!-- Helios — the coded design system (anchor) -->
    <div class="relative flex flex-col items-center justify-center gap-1.5 shrink-0 w-28 h-[120px] bg-background border-[1.5px] border-[#B04318] border-t-[3px] px-2">
      <svg width="34" height="34" viewBox="0 0 24 24" stroke="#B04318" stroke-width="1.7" fill="none" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M18.9 5.1l-2.1 2.1M7.2 16.8l-2.1 2.1" />
      </svg>
      <div class="font-mono text-[12px] font-semibold tracking-[0.16em] uppercase text-[#7A2C10] leading-none">Helios</div>
      <div class="flex items-center gap-1 font-mono text-[8.5px] tracking-wide text-[#857C74]">
        <svg width="12" height="12" viewBox="0 0 24 24" stroke="#857C74" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6l-5 6 5 6M16 6l5 6-5 6" />
        </svg>
        coded system
      </div>
    </div>

    <!-- link 2: Helios → Product -->
    <div class="relative flex items-center flex-1 min-w-[20px]">
      <div class="h-px flex-1 bg-[#B04318]"></div>
      <svg width="8" height="8" viewBox="0 0 8 8" class="shrink-0 -ml-px">
        <path d="M1 1 L7 4 L1 7 Z" fill="#B04318" />
      </svg>
    </div>

    <!-- Product -->
    <div class="relative flex items-center justify-center shrink-0">
      <div class="w-16 h-16 border border-border bg-background flex items-center justify-center">
        <svg width="30" height="30" viewBox="0 0 24 24" stroke="#5C5248" stroke-width="1.9" fill="none">
          <rect x="3" y="4" width="18" height="16" rx="1" />
          <path d="M3 8.5h18" />
        </svg>
      </div>
      <div class="absolute top-full mt-2 font-mono text-[10px] tracking-[0.14em] uppercase text-[#5C5248] whitespace-nowrap">Product</div>
    </div>

  </div>
</div>
