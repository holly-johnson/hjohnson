<nav
  class="fixed top-0 left-0 right-0 z-50 transition-colors duration-300"
  [class]="navClass()"
>
  <div class="max-w-7xl mx-auto px-6 lg:px-12">
    <div class="flex items-center justify-between py-4">

      <!-- ── Logo ─────────────────────────────────────────────── -->
      <a routerLink="/" class="flex items-center gap-3 group">
        <div
          class="w-8 h-8 flex items-center justify-center transition-colors group-hover:bg-[#B04318]"
          [class]="logoBoxClass()"
        >
          <span
            class="text-sm font-bold font-mono transition-colors group-hover:text-[#F2EEE9]"
            [class]="logoInitialsClass()"
          >HJ</span>
        </div>
        <div class="hidden sm:block">
          <span
            class="text-sm font-semibold leading-none transition-colors"
            [class]="logoNameClass()"
          >Holly Johnson</span>
        </div>
      </a>

      <!-- ── Desktop links ────────────────────────────────────── -->
      <div class="hidden md:flex items-center gap-6">
        @for (link of links; track link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment"
            class="px-3 py-2.5 text-sm transition-colors"
            [class]="linkClass(link)"
          >{{ link.label }}</a>
        }
      </div>

      <!-- ── Mobile menu button ───────────────────────────────── -->
      <button
        type="button"
        (click)="toggleMobile()"
        class="md:hidden w-8 h-8 flex items-center justify-center transition-colors"
        [class]="mobileBtnClass()"
        [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-navigation"
      >
        @if (mobileMenuOpen()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" /><path d="m6 6 12 12" />
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="18" y2="18" />
          </svg>
        }
      </button>
    </div>

    <!-- ── Mobile drawer ─────────────────────────────────────── -->
    @if (mobileMenuOpen()) {
      <div id="mobile-navigation" class="md:hidden py-4">
        <div class="flex flex-col gap-1">
          @for (link of links; track link.label) {
            <a
              [routerLink]="link.path"
              [fragment]="link.fragment"
              (click)="mobileMenuOpen.set(false)"
              class="px-3 py-2.5 text-sm transition-colors"
              [class]="linkClass(link)"
            >{{ link.label }}</a>
          }
        </div>
      </div>
    }
  </div>
</nav>
