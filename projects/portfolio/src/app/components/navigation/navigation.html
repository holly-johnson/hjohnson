<!-- 1b editorial header: serif wordmark left, quiet text links right. -->
<header class="sticky top-0 z-50 bg-background">
  <div class="mx-auto flex max-w-6xl items-baseline justify-between px-6 py-7 lg:px-12" [class]="navClass()">

    <a routerLink="/" class="font-serif text-wordmark tracking-[-0.01em] text-foreground">Holly Johnson</a>

    <!-- ── Desktop links ────────────────────────────────────── -->
    <nav class="hidden items-baseline gap-7 text-sm md:flex" aria-label="Primary">
      @for (link of links; track link.path + link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          [class]="linkClass(link)"
        >{{ link.label }}</a>
      }
      <button
        type="button"
        (click)="theme.toggle()"
        class="inline-flex h-6 w-6 items-center justify-center self-center text-muted-foreground transition-colors hover:text-foreground"
        [attr.aria-label]="theme.resolvedTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme.resolvedTheme() === 'dark') {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" /></svg>
        }
      </button>
    </nav>

    <!-- ── Mobile menu button ───────────────────────────────── -->
    <button
      type="button"
      class="md:hidden"
      [class]="mobileBtnClass()"
      (click)="mobileMenuOpen.set(!mobileMenuOpen())"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle menu"
    >
      @if (mobileMenuOpen()) {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      }
    </button>
  </div>

  <!-- ── Mobile menu ──────────────────────────────────────────── -->
  @if (mobileMenuOpen()) {
    <div class="border-t border-border bg-background md:hidden">
      <div class="mx-auto flex max-w-6xl flex-col gap-1 px-6 py-5">
        @for (link of links; track link.path + link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment"
            (click)="mobileMenuOpen.set(false)"
            class="py-2 text-base"
            [class]="linkClass(link)"
          >{{ link.label }}</a>
        }
        <button
          type="button"
          (click)="theme.toggle()"
          class="mt-1 self-start py-2 text-base text-muted-foreground transition-colors hover:text-foreground"
          [attr.aria-label]="theme.resolvedTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >{{ theme.resolvedTheme() === 'dark' ? 'Light mode' : 'Dark mode' }}</button>
      </div>
    </div>
  }
</header>
